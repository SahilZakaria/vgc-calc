<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VGC Calc</title>
    <script>
      // Apply the saved theme before first paint. Mirrors loadThemePreference
      // in src/theme.ts; keep the storage key and values in sync with it.
      try {
        var saved = localStorage.getItem('vgc-calc:theme');
        if (saved === 'dark' || saved === 'light' || saved === 'system') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
